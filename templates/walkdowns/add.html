{% extends "base.html" %}
{% block title %}Log Walkdown — EHS Inspector{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-7">
    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('walkdown_list') }}">Walkdowns</a></li>
        <li class="breadcrumb-item active">Log Walkdown</li>
      </ol>
    </nav>

    <div class="card">
      <div class="card-header bg-warning text-dark">
        <h5 class="mb-0"><i class="bi bi-person-walking me-2"></i>Log New Walkdown</h5>
      </div>
      <div class="card-body">
        <form method="post">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Inspector Name <span class="text-danger">*</span></label>
              <input type="text" name="inspector_name" class="form-control" required
                     placeholder="Full name">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Walkdown Date <span class="text-danger">*</span></label>
              <input type="date" name="walkdown_date" class="form-control" required
                     value="{{ today }}" max="{{ today }}">
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Area / Location <span class="text-danger">*</span></label>
              <input type="text" name="area_location" class="form-control" required
                     placeholder="e.g. Warehouse Floor Zone A, Building 3 Mezzanine">
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Findings / Observations</label>
              <textarea name="findings" class="form-control" rows="4"
                        placeholder="Describe what was observed during the walkdown — hazards, conditions, compliance issues..."></textarea>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Actions Required</label>
              <textarea name="actions_required" class="form-control" rows="3"
                        placeholder="List corrective actions needed, responsible parties, deadlines..."></textarea>
            </div>
          </div>

          <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-warning text-dark fw-semibold">
              <i class="bi bi-check-circle me-1"></i>Save Walkdown
            </button>
            <a href="{{ url_for('walkdown_list') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
